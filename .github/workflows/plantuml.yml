name: Generate PlantUML diagrams

on:
  push:
    paths:
      - 'docs/diagrams/**/*.puml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create output folder
        run: mkdir -p docs/diagrams/svg

      - name: Generate diagrams (SVG)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            plantuml/plantuml \
            -tsvg -o svg -r /work/docs/diagrams

      - name: Debug list generated SVG
        run: |
          echo "=== SVG FILES ==="
          find docs/diagrams/svg -name "*.svg" || true

      - name: Commit generated images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate PlantUML diagrams"
          file_pattern: "docs/diagrams/svg/**/*.svg"
