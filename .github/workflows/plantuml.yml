name: Generate PlantUML diagrams

on:
  push:
    paths:
      - 'docs/diagrams/**/*.puml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create output folder
        run: mkdir -p docs/diagrams/svg

      - name: Generate PlantUML diagrams
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            plantuml/plantuml \
            -tsvg -o svg -r /work/docs/diagrams

      - name: Create Pull Request with generated diagrams
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Auto-generate PlantUML diagrams"
          title: "Update PlantUML diagrams"
          body: "Auto-generated SVG diagrams from .puml sources"
          branch: auto/plantuml-diagrams
          base: main
          delete-branch: true
          add-paths: |
            docs/diagrams/svg
