<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f4f6f7;font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr><td align="center" style="padding:40px 16px;">
      <table width="460" cellpadding="0" cellspacing="0" style="max-width:460px;width:100%;background:#ffffff;border-radius:20px;overflow:hidden;">

        <!-- Header -->
        <tr>
          <td style="background:#264653;padding:36px 36px 48px;text-align:center;">
            <div style="display:inline-flex;align-items:center;justify-content:center;background:rgba(42,157,143,0.25);border-radius:50%;width:72px;height:72px;margin-bottom:16px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24"
                   fill="none" stroke="#2a9d8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
            </div>
            <p style="margin:0;font-size:13px;font-weight:700;color:#2a9d8f;letter-spacing:2px;text-transform:uppercase;">Районный</p>
          </td>
        </tr>

        <!-- Card -->
        <tr>
          <td style="padding:0 28px;">
            <table width="100%" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:16px;margin-top:-24px;padding:28px;box-shadow:0 4px 24px rgba(38,70,83,0.10);">
              <tr>
                <td>
                  <h2 style="margin:0 0 12px;font-size:20px;font-weight:700;color:#264653;text-align:center;">Открыт спор</h2>
                  <p style="margin:0 0 12px;font-size:15px;color:#3d5a66;line-height:1.65;text-align:center;">
                    По заказу
                    <strong style="font-family:monospace;background:#f0f4f5;padding:2px 8px;border-radius:6px;font-size:14px;color:#264653;">{{orderId}}</strong>
                    был открыт спор.
                  </p>
                  <p style="margin:0;font-size:15px;color:#3d5a66;line-height:1.65;text-align:center;">
                    Мы рассмотрим ситуацию в течение 24 часов и свяжемся с вами.
                  </p>
                  {{actionButton}}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:24px 36px;text-align:center;">
            <p style="margin:0;font-size:13px;color:#8a9ba5;line-height:1.6;">Это автоматическое письмо. Не отвечайте на него.</p>
            <p style="margin:12px 0 0;font-size:12px;color:#c0cdd2;">© 2026 Районный · Гиперлокальный маркетплейс</p>
          </td>
        </tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
